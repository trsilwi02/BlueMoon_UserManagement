<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="../Image/logo.png" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký</title>
    <link rel="stylesheet" href="dangky.css" />
  </head>
  <body>
    <div class="container">
      <div class="left-section">
        <div class="signup-box">
          <input type="text" id="fullname" placeholder="Họ và tên" />
          <input type="text" id="username" placeholder="Tên đăng nhập" />
          <input type="text" id="password" placeholder="Password" />
          <div class="btn">
            <button class="signup-btn" id="signup-btn">Đăng ký</button>
            <p style="margin-top: 15px">
              Đã có tài khoản?
              <a
                href="../login/index.html"
                style="color: #1877f2; text-decoration: none"
                >Đăng nhập ngay</a
              >
            </p>
          </div>
        </div>
      </div>
      <div class="right-section">
        <img src="../Image/favicon3.png" alt="Logo" class="project-logo" />
        <p class="description">Hệ thống Quản lý Dân cư Blue Moon</p>
      </div>
    </div>
    <script src="dangky.js"></script>
  </body>
</html>

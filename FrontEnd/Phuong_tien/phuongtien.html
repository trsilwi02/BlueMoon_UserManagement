<!DOCTYPE html>
<html lang="vi">
<head>
    <script src="/BlueMoon_UserManagement/FrontEnd/main_layout/auth.js"></script>
    <script>
        checkAuth();
    </script>


    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../Image/logo.png" type="image/x-icon" />
    <title>Quản lý Phương tiện</title>

    <!-- Layout chung -->
    <link rel="stylesheet" href="../main_layout/layout.css" />
    <!-- CSS riêng -->
    <link rel="stylesheet" href="phuongtien.css" />
</head>

<body>
<div id="sidebar"></div>

<div class="main">

    <!-- ================= TOP BAR ================= -->
    <div class="top-bar">

        <!-- SEARCH -->
        <div class="search-box">
            <label style="font-weight: 600; white-space: nowrap">
                Tìm kiếm:
            </label>

            <div class="input-group">
                <input
                        type="text"
                        id="searchInput"
                        placeholder="Nhập mã hộ, tên chủ xe, biển số hoặc loại xe..."
                />
                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="2"
                     stroke="currentColor">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M21 21l-5.197-5.197m0 0
                   A7.5 7.5 0 105.196 5.196
                   a7.5 7.5 0 0010.607 10.607z"/>
                </svg>
            </div>
        </div>

        <!-- ADD BUTTON -->
        <button id="newadd">Thêm mới</button>

        <!-- ================= MODAL ================= -->
        <div id="modalOverlay" class="overlay">
            <div class="modal">

                <h2>Thông tin phương tiện</h2>

                <!-- ⭐ BẮT BUỘC: IDHoKhau -->
                <label>Mã hộ khẩu</label>
                <input type="text" id="modalIDHoKhau" />

                <label>Chủ phương tiện</label>
                <input type="text" id="modalOwner" />

                <label>Biển số</label>
                <input type="text" id="modalPlate" />

                <label>Loại xe</label>
                <input type="text" id="modalType" />

                <label>Ghi chú</label>
                <input type="text" id="modalNote" />

                <div class="buttons">
                    <button id="save">Lưu lại</button>
                    <button id="close">Đóng</button>
                </div>

            </div>
        </div>

    </div>
    <!-- ================= END TOP BAR ================= -->


    <!-- ================= TABLE SECTION ================= -->
    <section class="table-section">
        <div class="table-container">
            <div class="table-scroll-area">

                <table>
                    <thead>
                    <tr>
                        <th style="text-align:center">STT</th>
                        <th style="text-align:center">Mã hộ</th>
                        <th>Chủ phương tiện</th>
                        <th>Biển số</th>
                        <th>Loại xe</th>
                        <th>Ghi chú</th>
                        <th style="text-align:center">Tác vụ</th>
                    </tr>
                    </thead>

                    <tbody id="tableBody">
                    <!-- JS render -->
                    </tbody>
                </table>

            </div>
        </div>
    </section>

</div>

<!-- JS -->
<script src="phuongtien.js"></script>
<script src="../main_layout/sidebar.js"></script>
</body>
</html>

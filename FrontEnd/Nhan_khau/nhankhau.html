<!DOCTYPE html>
<html lang="vi">
  <head>
      <script src="/BlueMoon_UserManagement/FrontEnd/main_layout/auth.js"></script>
      <script>
          checkAuth();
      </script>

      <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../Image/logo.png" type="image/x-icon" />
    <title>Quản lý Nhân khẩu</title>
    <link rel="stylesheet" href="../main_layout/layout.css" />
    <link rel="stylesheet" href="nhankhau.css" />
  </head>
  <body>
    <div id="sidebar"></div>

    <div class="main">
      <!-- Search & Filter -->
      <div class="top-bar">
        <div class="search-box">
          <label style="font-weight: 600; white-space: nowrap">Tìm kiếm:</label>
          <div class="input-group">
            <input
              type="text"
              id="searchInput"
              placeholder="Nhập tên, CCCD hoặc SĐT..."
            />
            <svg
              xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"
              />
            </svg>
          </div>
        </div>

        <!-- Thống kê -->
        <div class="stats-box">
          <span style="font-weight: 600; color: #475569">Số lượng:</span>
          <span id="totalCount" class="stats-number">0</span>
        </div>
      </div>

      <!-- Data Table -->
      <section class="table-section">
        <div class="table-container">
          <div class="table-scroll-area">
            <table>
              <thead>
                <tr>
                  <th style="width: 50px; text-align: center">STT</th>
                  <th>Họ và tên</th>
                  <th style="text-align: center">Ngày sinh</th>
                  <th style="text-align: center">Giới tính</th>
                  <th style="text-align: center">CCCD</th>
                  <th style="text-align: center">SĐT</th>
                  <th style="text-align: center">ID Hộ Khẩu</th>
                  <th style="text-align: center">Địa chỉ</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <!-- JS sẽ render dữ liệu vào đây -->
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <script src="nhankhau.js"></script>
    <script src="../main_layout/sidebar.js"></script>
  </body>
</html>

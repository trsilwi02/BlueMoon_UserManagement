        <h2>Thông tin hộ gia đình</h2>

        <div id="modalOverlay2" class="overlay2">
          <div class="modal2">
            <h2>Thông tin thành viên</h2>

            <label>Họ tên:</label>
            <input type="text" id="hoTen" />

            <label>Ngày sinh:</label>

            <div class="buttons">
              <button id="save2">Thêm</button>
              <button id="close2">Đóng</button>
            </div>
          </div>
        </div>
      </div>

      <table>

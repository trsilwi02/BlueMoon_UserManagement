<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/FrontEnd/Image/logo.png"
      type="image/x-icon"
    />
    <title>Thêm thành viên hộ gia đình</title>
    <link rel="stylesheet" href="/FrontEnd/main_layout/layout.css" />
    <link rel="stylesheet" href="info_table.css" />
  </head>
  <body>
    <div id="sidebar"></div>

    <div class="main">
      <div class="top-bar">
        <h2>Thông tin hộ gia đình</h2>
        <button id="add_mem">Thêm thành viên</button>
        <div id="modalOverlay2" class="overlay2">
          <div class="modal2">
            <h2>Thông tin thành viên</h2>

            <label>Họ tên:</label>
            <input type="text" id="hoTen" />

            <label>Ngày sinh:</label>
            <input type="date" id="ngaySinh" />

            <label>CCCD:</label>
            <input type="text" id="cccd" />

            <label>SĐT:</label>
            <input type="text" id="sdt" />

            <label>Quan hệ với chủ hộ</label>
            <input type="text" id="quanHeChuHo" />

            <div class="buttons">
              <button id="save2">Thêm</button>
              <button id="close2">Đóng</button>
            </div>
          </div>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>STT</th>
            <th>Họ và tên</th>
            <th>Ngày sinh</th>
            <th>CCCD</th>
            <th>SĐT</th>
            <th>Quan hệ với chủ hộ</th>
            <th>Tác vụ</th>
          </tr>
        </thead>
        <tbody id="mem-tableBody">
          <!-- Dữ liệu sẽ được JS thêm vào đây -->
        </tbody>

        <!-- <tbody>
          <tr>
            <td>H001</td>
            <td>Nguyễn Văn A</td>
            <td>22/02/2005</td>
            <td>0402050002672</td>
            <td>0941671645</td>
            <td>Chủ hộ</td>
            <td>
              <button id="delete_info2" class="action-btn">Xóa</button>
            </td>
          </tr>
        </tbody> -->
      </table>
    </div>

    <script src="info_table.js"></script>
    <script src="/FrontEnd/main_layout/sidebar.js"></script>
  </body>
</html>
